name: planova_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
    
  google_sign_in: ^6.2.1

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # File & Path
  path_provider: ^2.1.1
  path: ^1.8.3

  # UI & State Management
  provider: ^6.1.1
  cupertino_icons: ^1.0.8

  # Image Handling
  image_picker: ^1.0.7
  image: ^4.0.17

  # HTTP
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Sensors / Indoor Positioning
  sensors_plus: ^5.0.1
  pedometer: ^4.0.1
  permission_handler: ^11.3.1
  flutter_compass: ^0.8.0

  # Math
  vector_math: ^2.1.4

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utilities
  uuid: ^4.0.0
  share_plus: ^7.2.1
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/planova.png"

flutter:
  uses-material-design: true